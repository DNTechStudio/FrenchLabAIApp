    const COMPOUND_EXCEPTIONS = [
      'rendez-vous', 'au-dessus', 'au-dessous', 'au-delà', 'vis-à-vis', 'arc-en-ciel'
    ];

    function countFrenchWords(text) {
      if (!text || !text.trim()) return 0;
      let normalized = text.replace(/[’‘]/g, "'");
      COMPOUND_EXCEPTIONS.forEach((c, idx) => {
        normalized = normalized.replace(new RegExp('\\b' + c + '\\b', 'gi'), `__c_${idx}__`);
      });
      normalized = normalized.replace(/[']/g, ' ');
      normalized = normalized.replace(/-(?:t-)?(je|tu|il|elle|on|nous|vous|ils|elles|ce)\b/gi, ' $1');
      COMPOUND_EXCEPTIONS.forEach((c, idx) => {
        normalized = normalized.replace(new RegExp(`__c_${idx}__`, 'g'), c);
      });
      const matches = normalized.match(/[a-zA-ZÀ-ÿœŒæÆ]+(?:-[a-zA-ZÀ-ÿœŒæÆ]+)*/g);
      return matches ? matches.length : 0;
    }

    function computeWordDiff(originalText, improvedText) {
      if (!originalText && !improvedText) return [];
      if (!originalText) return [{ value: improvedText, type: 'added' }];
      if (!improvedText) return [{ value: originalText, type: 'removed' }];

      const tokenize = (str) => str.match(/\S+|\s+/g) || [];
      const words1 = tokenize(originalText);
      const words2 = tokenize(improvedText);
      const m = words1.length;
      const n = words2.length;

      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (words1[i - 1] === words2[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }

      let i = m, j = n;
      const rawTokens = [];
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && words1[i - 1] === words2[j - 1]) {
          rawTokens.push({ value: words1[i - 1], type: 'unchanged' });
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          rawTokens.push({ value: words2[j - 1], type: 'added' });
          j--;
        } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
          rawTokens.push({ value: words1[i - 1], type: 'removed' });
          i--;
        }
      }
      rawTokens.reverse();

      const merged = [];
      for (const token of rawTokens) {
        if (merged.length > 0 && merged[merged.length - 1].type === token.type) {
          merged[merged.length - 1].value += token.value;
        } else {
          merged.push({ ...token });
        }
      }
      return merged;
    }

    /* ==========================================================================
       1.6. INTERACTIVE FRENCH DICTATION ENGINE (« La Dictée »)
       ========================================================================== */
    const FRENCH_HOMOPHONE_CLUSTERS = [
      ["c'est", "s'est", 'ces', 'ses', 'sais', 'sait'],
      ['a', 'à'],
      ['ou', 'où'],
      ['on', 'ont'],
      ['son', 'sont'],
      ['ce', 'se'],
      ['leur', 'leurs'],
      ['tout', 'tous'],
      ['la', 'là', "l'a", "l'as"],
      ['peu', 'peut', 'peux'],
      ['près', 'prêt'],
      ['mes', 'mais', 'met', 'mets'],
      ['dans', "d'en", 'dent'],
      ['sans', "s'en", 'cent', 'sang'],
    ];

    function stripAccents(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function cleanWord(str) {
      return str
        .replace(/^[\s.,;:!?"'«»()—–-]+|[\s.,;:!?"'«»()—–-]+$/g, '')
        .trim()
        .toLowerCase();
    }

    function splitFrenchSentences(text) {
      if (!text || !text.trim()) return [];
      const protectedText = text
        .replace(/\bM\.\s+/g, 'M_DOT_SPACE_')
        .replace(/\bMme\.\s+/g, 'MME_DOT_SPACE_')
        .replace(/\bMlle\.\s+/g, 'MLLE_DOT_SPACE_')
        .replace(/\betc\.\s*(?=[,a-zà-ÿ])/g, 'ETC_DOT_SPACE_')
        .replace(/\bDr\.\s+/g, 'DR_DOT_SPACE_')
        .replace(/\bProf\.\s+/g, 'PROF_DOT_SPACE_')
        .replace(/\n+/g, ' BREAK_PARAGRAPH_ ');

      const rawSentences = protectedText.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ÿ0-9«"–—]|BREAK_PARAGRAPH_|$)/);
      const sentences = [];

      rawSentences.forEach((raw) => {
        const cleaned = raw
          .replace(/M_DOT_SPACE_/g, 'M. ')
          .replace(/MME_DOT_SPACE_/g, 'Mme. ')
          .replace(/MLLE_DOT_SPACE_/g, 'Mlle. ')
          .replace(/ETC_DOT_SPACE_/g, 'etc. ')
          .replace(/DR_DOT_SPACE_/g, 'Dr. ')
          .replace(/PROF_DOT_SPACE_/g, 'Prof. ')
          .replace(/BREAK_PARAGRAPH_/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        if (cleaned.length > 0) {
          sentences.push({
            index: sentences.length + 1,
            text: cleaned,
            wordCount: countFrenchWords(cleaned),
          });
        }
      });
      return sentences;
    }

    function classifyDictationMistake(expectedRaw, userRaw) {
      const expected = cleanWord(expectedRaw);
      const user = cleanWord(userRaw);

      if (!expected || !user) return 'lexique';

      for (const cluster of FRENCH_HOMOPHONE_CLUSTERS) {
        if (cluster.includes(expected) && cluster.includes(user)) {
          return 'homophones';
        }
      }

      if (stripAccents(expected) === stripAccents(user) && expected !== user) {
        return 'accents';
      }

      const isPluralDiff =
        expected + 's' === user ||
        user + 's' === expected ||
        expected + 'x' === user ||
        user + 'x' === expected;

      const isFeminineDiff =
        expected + 'e' === user ||
        user + 'e' === expected ||
        expected + 'es' === user ||
        user + 'es' === expected;

      const isParticipleOrVerbDiff =
        /^(.*)(er|ez|é|ée|és|ées)$/.test(expected) &&
        /^(.*)(er|ez|é|ée|és|ées)$/.test(user) &&
        expected.replace(/(er|ez|é|ée|és|ées)$/, '') === user.replace(/(er|ez|é|ée|és|ées)$/, '');

      const isVerbEndingDiff =
        /^(.*)(e|ent|ait|aient|ons|ont|ais|ait)$/.test(expected) &&
        /^(.*)(e|ent|ait|aient|ons|ont|ais|ait)$/.test(user) &&
        expected.slice(0, 3) === user.slice(0, 3);

      if (isPluralDiff || isFeminineDiff || isParticipleOrVerbDiff || isVerbEndingDiff) {
        return 'accords';
      }

      return 'lexique';
    }

    function getMistakeExplanation(category, expected, user) {
      switch (category) {
        case 'accents':
          return `Attention aux accents : "${user}" au lieu de "${expected}". En français, les accents modifient la prononciation et la nature grammaticale.`;
        case 'homophones':
          return `Confusion d'homophones grammaticaux : "${user}" a été écrit à la place de "${expected}". Distinguez la nature grammaticale de ces mots de même sonorité.`;
        case 'accords':
          return `Erreur d'accord ou de morphosyntaxe : "${user}" au lieu de "${expected}". Vérifiez les accords en genre/nombre et les terminaisons verbales.`;
        case 'lexique':
        default:
          return `Écart lexical ou orthographique : "${user}" attendu "${expected}".`;
      }
    }

    function evaluateDictation(referenceText, userText) {
      const totalExpectedWords = countFrenchWords(referenceText);
      if (totalExpectedWords === 0) {
        return {
          accuracy: 100,
          totalExpectedWords: 0,
          correctWordsCount: 0,
          mistakesCount: 0,
          mistakes: [],
          diffTokens: [],
          evaluatedAt: Date.now(),
        };
      }

      const diffTokens = computeWordDiff(referenceText, userText);
      const mistakes = [];
      let correctWordsCount = 0;

      for (let i = 0; i < diffTokens.length; i++) {
        const token = diffTokens[i];
        if (token.type === 'unchanged') {
          correctWordsCount += countFrenchWords(token.value);
        } else if (token.type === 'removed') {
          const expectedWords = token.value.trim().split(/\s+/).filter(Boolean);
          const nextToken = diffTokens[i + 1];

          if (nextToken && nextToken.type === 'added') {
            const userWords = nextToken.value.trim().split(/\s+/).filter(Boolean);
            const maxLen = Math.max(expectedWords.length, userWords.length);

            for (let j = 0; j < maxLen; j++) {
              const exp = expectedWords[j] || '';
              const usr = userWords[j] || '';

              if (exp && usr) {
                const cat = classifyDictationMistake(exp, usr);
                mistakes.push({
                  id: `mistake-${mistakes.length + 1}`,
                  category: cat,
                  expectedWord: exp,
                  userWord: usr,
                  explanation: getMistakeExplanation(cat, exp, usr),
                });
              } else if (exp) {
                mistakes.push({
                  id: `mistake-${mistakes.length + 1}`,
                  category: 'lexique',
                  expectedWord: exp,
                  userWord: '∅ (mot omis)',
                  explanation: `Le mot "${exp}" a été omis dans votre transcription.`,
                });
              }
            }
            i++;
          } else {
            expectedWords.forEach((exp) => {
              mistakes.push({
                id: `mistake-${mistakes.length + 1}`,
                category: 'lexique',
                expectedWord: exp,
                userWord: '∅ (mot omis)',
                explanation: `Le mot "${exp}" a été omis dans votre transcription.`,
              });
            });
          }
        }
      }

      const mistakesCount = mistakes.length;
      const accuracy = Math.max(0, Math.min(100, Math.round(((totalExpectedWords - mistakesCount) / totalExpectedWords) * 100)));

      return {
        accuracy,
        totalExpectedWords,
        correctWordsCount,
        mistakesCount,
        mistakes,
        diffTokens,
        evaluatedAt: Date.now(),
      };
    }

    const FRENCH_VOICE_CATALOG = [
      { id: 'webspeech-default', name: 'Navigateur Web Speech', gender: 'female', provider: 'webspeech', styleBadge: 'Gratuit & Hors-ligne', description: 'Voix synthétique intégrée au navigateur (100% hors-ligne)' },
      { id: 'fr-FR-Neural2-A', name: 'Élise (Neural2-A)', gender: 'female', provider: 'google-cloud', styleBadge: 'Naturel ✨', description: 'Voix féminine fluide, intonation riche et naturelle avec liaisons soignées' },
      { id: 'fr-FR-Neural2-B', name: 'Julien (Neural2-B)', gender: 'male', provider: 'google-cloud', styleBadge: 'Posé 🎙️', description: 'Voix masculine articulée et posée, idéale pour la dictée analytique' },
      { id: 'fr-FR-Studio-B', name: 'Claire (Studio-B)', gender: 'female', provider: 'google-cloud', styleBadge: 'Studio 🌟', description: 'Qualité radiodiffusion haute clarté, diction irréprochable et liaisons parfaites' },
      { id: 'fr-FR-Journey-F', name: 'Antoine (Journey-F)', gender: 'male', provider: 'google-cloud', styleBadge: 'Expressif 🔥', description: 'Prosodie conversationnelle moderne avec modulations de voix réalistes' },
      { id: 'nova', name: 'Nova (OpenAI)', gender: 'female', provider: 'openai', styleBadge: 'Chaleureux 🎧', description: 'Voix féminine expressive, timbre chaleureux et excellente fluidité' },
      { id: 'onyx', name: 'Onyx (OpenAI)', gender: 'male', provider: 'openai', styleBadge: 'Profond 🎩', description: 'Voix masculine grave, rythme posé et rassurant' }
    ];

    const DEFAULT_TTS_CONFIG = {
      engine: 'webspeech',
      voiceId: 'webspeech-default'
    };

    const SpeechService = {
      isSupported() {
        return typeof window !== 'undefined' && 'speechSynthesis' in window;
      },
      frenchVoice: null,
      activeAudioElement: null,
      audioCache: new Map(),

      init() {
        if (!this.isSupported()) return;
        const find = () => {
          const voices = window.speechSynthesis.getVoices();
          this.frenchVoice =
            voices.find((v) => v.lang.startsWith('fr') && /natural|neural|online|enhanced/i.test(v.name)) ||
            voices.find((v) => v.lang === 'fr-FR') ||
            voices.find((v) => v.lang.startsWith('fr')) ||
            null;
        };
        find();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = find;
        }
      },

      async speak(text, rate = 0.85, config, fallbackApiKey) {
        this.cancel();

        if (!config || config.engine === 'webspeech') {
          return this.speakWebSpeech(text, rate);
        }

        if (config.engine === 'google-cloud') {
          const key = (config.googleApiKey || fallbackApiKey || '').trim();
          if (!key) {
            console.warn('Google Cloud TTS selected but no key, using Web Speech.');
            return this.speakWebSpeech(text, rate);
          }
          try {
            return await this.speakGoogleCloud(text, rate, config.voiceId, key);
          } catch (e) {
            console.warn('Google Cloud TTS failed, using Web Speech fallback:', e);
            return this.speakWebSpeech(text, rate);
          }
        }

        if (config.engine === 'openai') {
          const key = (config.openaiApiKey || fallbackApiKey || '').trim();
          if (!key) {
            console.warn('OpenAI TTS selected but no key, using Web Speech.');
            return this.speakWebSpeech(text, rate);
          }
          try {
            return await this.speakOpenAI(text, rate, config.voiceId, key);
          } catch (e) {
            console.warn('OpenAI TTS failed, using Web Speech fallback:', e);
            return this.speakWebSpeech(text, rate);
          }
        }

        return this.speakWebSpeech(text, rate);
      },

      async speakGoogleCloud(text, rate, voiceId, apiKey) {
        const cacheKey = `gcloud:${voiceId}:${rate}:${text}`;
        if (this.audioCache.has(cacheKey)) {
          return this.playAudioUrl(this.audioCache.get(cacheKey), rate);
        }

        const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`;
        const payload = {
          input: { text },
          voice: {
            languageCode: 'fr-FR',
            name: voiceId,
            ssmlGender: voiceId.includes('B') || voiceId.includes('F') ? 'MALE' : 'FEMALE'
          },
          audioConfig: {
            audioEncoding: 'MP3',
            speakingRate: rate
          }
        };

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Google Cloud TTS API Error (${response.status}): ${errText}`);
        }

        const data = await response.json();
        if (!data.audioContent) throw new Error('No audioContent returned');

        const audioUrl = `data:audio/mp3;base64,${data.audioContent}`;
        this.audioCache.set(cacheKey, audioUrl);
        return this.playAudioUrl(audioUrl, rate);
      },

      async speakOpenAI(text, rate, voiceId, apiKey) {
        const cacheKey = `openai:${voiceId}:${rate}:${text}`;
        if (this.audioCache.has(cacheKey)) {
          return this.playAudioUrl(this.audioCache.get(cacheKey), rate);
        }

        const url = 'https://api.openai.com/v1/audio/speech';
        const payload = {
          model: 'tts-1',
          input: text,
          voice: voiceId,
          speed: rate
        };

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`OpenAI TTS API Error (${response.status}): ${errText}`);
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        this.audioCache.set(cacheKey, audioUrl);
        return this.playAudioUrl(audioUrl, rate);
      },

      playAudioUrl(url, rate) {
        return new Promise((resolve) => {
          const audio = new Audio(url);
          audio.playbackRate = rate;
          this.activeAudioElement = audio;
          audio.onended = () => {
            this.activeAudioElement = null;
            resolve();
          };
          audio.onerror = () => {
            this.activeAudioElement = null;
            resolve();
          };
          audio.play().catch((err) => {
            console.warn('Audio play failed:', err);
            this.activeAudioElement = null;
            resolve();
          });
        });
      },

      speakWebSpeech(text, rate = 0.85) {
        return new Promise((resolve) => {
          if (!this.isSupported()) return resolve();
          this.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'fr-FR';
          utterance.rate = rate;
          if (this.frenchVoice) utterance.voice = this.frenchVoice;
          utterance.onend = () => resolve();
          utterance.onerror = () => resolve();
          window.speechSynthesis.speak(utterance);
        });
      },

      async testVoiceSample(config, fallbackApiKey, sampleText = 'Bonjour, voici un aperçu de ma voix pour votre dictée DELF-DALF.') {
        await this.speak(sampleText, 1.0, config, fallbackApiKey);
      },

      pause() {
        if (this.activeAudioElement) this.activeAudioElement.pause();
        if (this.isSupported() && window.speechSynthesis.speaking) window.speechSynthesis.pause();
      },

      resume() {
        if (this.activeAudioElement && this.activeAudioElement.paused) this.activeAudioElement.play().catch(() => {});
        if (this.isSupported() && window.speechSynthesis.paused) window.speechSynthesis.resume();
      },

      cancel() {
        if (this.activeAudioElement) {
          this.activeAudioElement.pause();
          this.activeAudioElement.currentTime = 0;
          this.activeAudioElement = null;
        }
        if (this.isSupported()) window.speechSynthesis.cancel();
      },

      isSpeaking() {
        return (this.activeAudioElement !== null && !this.activeAudioElement.paused) || (this.isSupported() && window.speechSynthesis.speaking);
      }
    };
    SpeechService.init();

       ========================================================================== */
    const ALL_CEFR_LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    const DEFAULT_CEFR_LEVELS = ['B2'];

    const CEFR_LEVEL_METADATA = {

    /* ==========================================================================
       4. REACT APPLICATION UI
       ========================================================================== */
    const { useState, useEffect, useMemo, useRef, useCallback, createElement: h } = React;

    function App() {
      const [data, setData] = useState(() => StorageService.load());
      const [prompts] = useState(OFFICIAL_DELF_B2_PROMPTS);
      const [activePromptId, setActivePromptId] = useState(data.activePromptId || 'lettre-maire-espaces-verts');

      const selectedPrompt = useMemo(() => {
        return prompts.find((p) => p.id === activePromptId) || prompts[0];
      }, [prompts, activePromptId]);

      const [content, setContent] = useState(() => {
        return (data.drafts && data.drafts[activePromptId]) ? data.drafts[activePromptId].content : '';
      });

      const [theme, setTheme] = useState(data.settings?.theme || 'dark');
      const [currentLanguage, setCurrentLanguage] = useState(data.settings?.language || 'fr');
      const [settings, setSettings] = useState(() => {
        const s = data.settings || { provider: 'mock', theme: 'dark', language: 'fr', selectedLevels: ['B2'] };
        if (!s.ttsConfig) s.ttsConfig = { ...DEFAULT_TTS_CONFIG };
        return s;
      });
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isTestingVoice, setIsTestingVoice] = useState(false);

      // CEFR Levels State
      const [selectedLevels, setSelectedLevels] = useState(() => sanitizeSelectedLevels(data.settings?.selectedLevels));
      const [multiLevelResults, setMultiLevelResults] = useState({});
      const [loadingLevels, setLoadingLevels] = useState({});
      const [copiedLevels, setCopiedLevels] = useState({});
      const [levelViewModes, setLevelViewModes] = useState({});
      const [levelFilterCriteria, setLevelFilterCriteria] = useState({});
      const [selectorNotice, setSelectorNotice] = useState(null);

      // Dictation Mode State
      const [activeMode, setActiveMode] = useState('writing'); // 'writing' | 'dictation'
      const [customDictationLevel, setCustomDictationLevel] = useState(null);
      const [dictationIndex, setDictationIndex] = useState(0);
      const [dictationSpeed, setDictationSpeed] = useState(0.85);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [sentenceInputs, setSentenceInputs] = useState({});
      const [dictationTab, setDictationTab] = useState('sentence');
      const [fullDictationInput, setFullDictationInput] = useState('');
      const [dictationEvaluation, setDictationEvaluation] = useState(null);

      const dictationTargetLevel = customDictationLevel || selectedLevels[0] || 'B2';
      const handleSwitchToDictation = (lvl) => {
        if (lvl) setCustomDictationLevel(lvl);
        SpeechService.cancel();
        setIsPlayingAudio(false);
        setDictationEvaluation(null);
        setDictationIndex(0);
        setActiveMode('dictation');
      };
      const dictationReferenceText = useMemo(() => {
        if (multiLevelResults[dictationTargetLevel] && multiLevelResults[dictationTargetLevel].improvedText) {
          return multiLevelResults[dictationTargetLevel].improvedText;
        }
        const isLetter = selectedPrompt.id.startsWith('lettre');
        if (isLetter) {
          return "Monsieur le Maire,\n\nEn tant que représentant dévoué du collectif citoyen des résidents de notre commune, je me permets de porter respectueusement à votre haute attention nos plus vives préoccupations quant au vaste projet d'aménagement urbain récemment rendu public par les services municipaux.\n\nEn premier lieu, il me semble indéniable que la réduction drastique des espaces végétalisés portera un préjudice irréversible à la biodiversité locale ainsi qu'au bien-être quotidien de l'ensemble de nos concitoyens. Bien que nous comprenions parfaitement les impératifs budgétaires, nous estimons impératif qu'une véritable concertation publique transparente soit organisée sans délai.\n\nJe vous prie d'agréer, Monsieur le Maire, l'expression de ma considération la plus distinguée.";
        } else {
          return "À l'attention des participants au débat,\n\nJe souhaite apporter aujourd'hui une contribution constructive et approfondie au débat actuel concernant l'avenir de nos modes de travail et les mutations organisationnelles qui transforment notre quotidien professionnel.\n\nD'une part, il me semble indéniable que le développement du télétravail offre des opportunités considérables aux salariés comme aux entreprises contemporaines. D'autre part, néanmoins, force est de constater que la généralisation précipitée du travail à distance n'est point dépourvue d'écueils majeurs.\n\nEn conclusion, il est impératif que les partenaires sociaux instaurent un cadre réglementaire équilibré combinant souplesse organisationnelle et droit effectif à la déconnexion.";
        }
      }, [multiLevelResults, dictationTargetLevel, selectedPrompt.id]);

      const dictationSentences = useMemo(() => {
        return splitFrenchSentences(dictationReferenceText);
      }, [dictationReferenceText]);

      const currentDictSentence = dictationSentences[dictationIndex] || { index: 1, text: '', wordCount: 0 };
      const currentSentenceInput = sentenceInputs[dictationIndex] || '';

      const handlePlayDictation = useCallback(async (idx) => {
        const i = idx !== undefined ? idx : dictationIndex;
        const target = dictationSentences[i];
        if (!target || !target.text) return;
        try {
          setIsPlayingAudio(true);
          await SpeechService.speak(target.text, dictationSpeed, settings.ttsConfig, settings.apiKey);
        } catch (e) {
          console.warn('Speech playback failed', e);
        } finally {
          setIsPlayingAudio(false);
        }
      }, [dictationIndex, dictationSentences, dictationSpeed, settings.ttsConfig, settings.apiKey]);

      const handlePauseDictation = useCallback(() => {
        SpeechService.pause();
        setIsPlayingAudio(false);
      }, []);

      const handlePrevDictation = useCallback(() => {
        SpeechService.cancel();
        setIsPlayingAudio(false);
        setDictationIndex((prev) => Math.max(0, prev - 1));
        setDictationEvaluation(null);
      }, []);

      const handleNextDictation = useCallback(() => {
        SpeechService.cancel();
        setIsPlayingAudio(false);
        setDictationIndex((prev) => Math.min(dictationSentences.length - 1, prev + 1));
        setDictationEvaluation(null);
      }, [dictationSentences.length]);

      // Global keyboard shortcut listener (Ctrl + R: replay, Ctrl + Left: prev, Ctrl + Right: next)
      useEffect(() => {
        const onKey = (e) => {
          if (activeMode !== 'dictation') return;
          if ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R' || e.code === 'KeyR')) {
            e.preventDefault();
            handlePlayDictation();
          } else if (e.ctrlKey && (e.key === 'ArrowLeft' || e.code === 'ArrowLeft')) {
            e.preventDefault();
            handlePrevDictation();
          } else if (e.ctrlKey && (e.key === 'ArrowRight' || e.code === 'ArrowRight')) {
            e.preventDefault();
            handleNextDictation();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [activeMode, handlePlayDictation, handlePrevDictation, handleNextDictation]);

      const handleEvaluateDictation = () => {
        const userText = dictationTab === 'sentence' ? currentSentenceInput : fullDictationInput;
        const expected = dictationTab === 'sentence' ? currentDictSentence.text : dictationReferenceText;
        const result = evaluateDictation(expected, userText);
        setDictationEvaluation(result);
      };

      const handleResetDictationCurrent = () => {
        if (dictationTab === 'sentence') {
          setSentenceInputs((prev) => ({ ...prev, [dictationIndex]: '' }));
        } else {
          setFullDictationInput('');
          setSentenceInputs({});
        }
        setDictationEvaluation(null);
      };

      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.fr;

      const showNotice = (msg) => {
        setSelectorNotice(msg);
        setTimeout(() => setSelectorNotice((curr) => (curr === msg ? null : curr)), 2800);
      };

      const handleLanguageChange = (newLang) => {
        setCurrentLanguage(newLang);
        const updatedSettings = { ...settings, language: newLang };
        setSettings(updatedSettings);
        const updated = { ...data, settings: updatedSettings };
        setData(updated);
        StorageService.save(updated);
      };

      const handleToggleLevel = (lvl) => {
        const isSelected = selectedLevels.includes(lvl);
        if (isSelected) {
          if (selectedLevels.length <= 1) {
            showNotice(t.cefr?.minNotice || 'Au moins 1 niveau requis');
            return;
          }
          const updated = selectedLevels.filter((l) => l !== lvl);
          setSelectedLevels(updated);
          const updatedSettings = { ...settings, selectedLevels: updated };
          setSettings(updatedSettings);
          StorageService.save({ ...data, settings: updatedSettings });
        } else {
          if (selectedLevels.length >= 2) {
            showNotice(t.cefr?.maxNotice || 'Maximum 2 niveaux sélectionnés pour la comparaison');
            return;
          }
          const updated = ALL_CEFR_LEVELS.filter((l) => l === lvl || selectedLevels.includes(l));
          setSelectedLevels(updated);
          const updatedSettings = { ...settings, selectedLevels: updated };
          setSettings(updatedSettings);
          StorageService.save({ ...data, settings: updatedSettings });
        }
      };

      const wordCount = useMemo(() => countFrenchWords(content), [content]);

      // Apply theme
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        const updated = { ...data, settings: { ...settings, theme } };
        setData(updated);
        StorageService.save(updated);
      }, [theme]);

      // Debounced Autosave
      const saveTimer = useRef(null);
      useEffect(() => {
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => {
          const updated = {
            ...data,
            activePromptId: selectedPrompt.id,
            drafts: {
              ...data.drafts,
              [selectedPrompt.id]: { promptId: selectedPrompt.id, content, wordCount, lastSavedAt: Date.now() }
            }
          };
          setData(updated);
          StorageService.save(updated);
        }, 300);
        return () => clearTimeout(saveTimer.current);
      }, [content, wordCount, selectedPrompt.id]);

      const handleSelectPrompt = (prompt) => {
        setActivePromptId(prompt.id);
        const draft = data.drafts && data.drafts[prompt.id];
        setContent(draft ? draft.content : '');
        setMultiLevelResults({});
      };

      const handleRandomPrompt = () => {
        const remaining = prompts.filter((p) => p.id !== selectedPrompt.id);
        const random = remaining[Math.floor(Math.random() * remaining.length)];
        handleSelectPrompt(random);
      };

      const handleReset = () => {
        if (window.confirm('Voulez-vous réinitialiser votre brouillon pour ce sujet ?')) {
          setContent('');
          setMultiLevelResults({});
          const drafts = { ...data.drafts };
          delete drafts[selectedPrompt.id];
          const updated = { ...data, drafts };
          setData(updated);
          StorageService.save(updated);
        }
      };

      const isAnyLoading = useMemo(() => Object.values(loadingLevels).some(Boolean), [loadingLevels]);

      const handleImprove = async () => {
        if (isAnyLoading) return;

        const initLoading = {};
        selectedLevels.forEach((lvl) => { initLoading[lvl] = true; });
        setLoadingLevels(initLoading);

        try {
          await Promise.all(
            selectedLevels.map(async (lvl) => {
              try {
                let res;
                if (settings.provider === 'gemini' && settings.apiKey) {
                  res = await improveEssayGemini(selectedPrompt, content, settings.apiKey, lvl);
                } else {
                  res = await improveEssayMock(selectedPrompt.id, content, lvl);
                }
                setMultiLevelResults((prev) => ({ ...prev, [lvl]: res }));
              } catch (err) {
                console.error('Improvement error for ' + lvl, err);
              } finally {
                setLoadingLevels((prev) => ({ ...prev, [lvl]: false }));
              }
            })
          );
        } finally {
          setLoadingLevels({});
        }
      };

      const handleCopyLevel = async (lvl) => {
        const res = multiLevelResults[lvl];
        if (!res) return;
        await navigator.clipboard.writeText(res.improvedText);
        setCopiedLevels((prev) => ({ ...prev, [lvl]: true }));
        setTimeout(() => setCopiedLevels((prev) => ({ ...prev, [lvl]: false })), 2000);
      };

      const isTargetAchieved = wordCount >= 250;
      const progressPercent = Math.min(100, Math.round((wordCount / 250) * 100));

      // Render individual comparison window
      const renderComparisonWindow = (lvl) => {
        const meta = CEFR_LEVEL_METADATA[lvl];
        const levelTrans = t.cefr?.levels?.[lvl];
        const result = multiLevelResults[lvl];
        const isLvlLoading = !!loadingLevels[lvl];
        const hasCopied = !!copiedLevels[lvl];
        const viewMode = levelViewModes[lvl] || ((result && (result.isAutonomous || !result.originalText || !result.originalText.trim())) ? 'clean' : 'diff');
        const selectedCriterion = levelFilterCriteria[lvl] || 'all';

        const lvlWordCount = result ? countFrenchWords(result.improvedText) : 0;
        const filteredNotes = result ? (
          selectedCriterion === 'all'
            ? result.pedagogicalNotes
            : result.pedagogicalNotes.filter((n) => n.criterion === selectedCriterion)
        ) : [];

        return h('div', {
          key: lvl,
          className: 'comparison-window-card',
          style: { borderTop: `3px solid ${meta.color}` }
        },
          // Window Header
          h('div', { className: 'comparison-window-header' },
            h('div', { className: 'comparison-window-meta' },
              h('span', {
                className: 'cefr-level-badge',
                style: { backgroundColor: meta.badgeBg, color: meta.color, border: `1px solid ${meta.borderActive}` }
              }, `✨ ${lvl} — ${levelTrans?.name || lvl}`),
              result && h('span', { className: 'comparison-window-wordcount' }, `${lvlWordCount} ${t.editor.wordsLabel}`)
            ),
            result && h('button', {
              className: 'btn-secondary',
              style: { padding: '0.25rem 0.6rem', fontSize: '0.75rem' },
              onClick: () => handleCopyLevel(lvl)
            }, hasCopied ? `✓ ${t.comparison.copiedButton}` : `📋 ${t.comparison.copyButton}`)
          ),

          // Window Body
          h('div', { className: 'comparison-window-body' },
            isLvlLoading ? h('div', { style: { textAlign: 'center', padding: '3rem', color: 'var(--text-secondary)' } },
              h('div', { style: { fontSize: '2rem', marginBottom: '0.75rem' } }, '⏳'),
              h('p', { style: { fontWeight: 600, fontSize: '0.9rem' } }, `Génération de la version ${lvl}...`)
            ) : !result ? h('div', { style: { textAlign: 'center', padding: '2.5rem 1.5rem', color: 'var(--text-muted)' } },
              h('div', {
                style: {
                  width: '46px', height: '46px', borderRadius: 'var(--radius-lg)', background: meta.badgeBg,
                  border: `1px solid ${meta.borderActive}`, margin: '0 auto 0.75rem auto',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.25rem'
                }
              }, '📖'),
              h('h4', { style: { fontFamily: 'var(--font-display)', color: 'var(--text-primary)', marginBottom: '0.35rem' } },
                `${lvl} (${levelTrans?.name || lvl})`
              ),
              h('p', { style: { fontSize: '0.8rem', maxWidth: '320px', margin: '0 auto', lineHeight: 1.5 } },
                levelTrans?.desc || t.comparison.emptySubtitle
              ),
              h('button', {
                className: 'btn-secondary',
                style: {
                  marginTop: '0.75rem',
                  padding: '0.35rem 0.75rem',
                  fontSize: '0.8rem',
                  color: 'var(--accent-secondary)',
                  borderColor: 'rgba(6, 182, 212, 0.35)'
                },
                onClick: () => handleSwitchToDictation(lvl),
                title: t.dictation?.tabTitle || 'Mode Dictée'
              }, `🎧 ${t.dictation?.tabTitle || 'Mode Dictée'}`)
            ) : h('div', null,
              // View mode controls
              h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.65rem' } },
                h('span', { style: { fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase' } },
                  t.comparison.tabUnified
                ),
                h('div', { style: { display: 'flex', gap: '0.35rem' } },
                  h('button', {
                    className: 'btn-secondary',
                    style: {
                      padding: '0.25rem 0.55rem', fontSize: '0.72rem',
                      borderColor: viewMode === 'diff' ? meta.color : 'var(--border-subtle)',
                      background: viewMode === 'diff' ? meta.badgeBg : 'var(--bg-surface)'
                    },
                    onClick: () => setLevelViewModes((prev) => ({ ...prev, [lvl]: 'diff' }))
                  }, `📊 ${t.comparison.tabUnified}`),
                  h('button', {
                    className: 'btn-secondary',
                    style: {
                      padding: '0.25rem 0.55rem', fontSize: '0.72rem',
                      borderColor: viewMode === 'clean' ? meta.color : 'var(--border-subtle)',
                      background: viewMode === 'clean' ? meta.badgeBg : 'var(--bg-surface)'
                    },
                    onClick: () => setLevelViewModes((prev) => ({ ...prev, [lvl]: 'clean' }))
                  }, `👁️ ${(t.comparison.tabImproved || '').replace(/B2/g, lvl)}`),
                  h('button', {
                    className: 'btn-secondary',
                    style: {
                      padding: '0.25rem 0.55rem', fontSize: '0.72rem',
                      color: 'var(--accent-secondary)',
                      borderColor: 'rgba(6, 182, 212, 0.35)',
                      background: 'var(--bg-surface)'
                    },
                    onClick: () => handleSwitchToDictation(lvl),
                    title: t.dictation?.tabTitle || 'Mode Dictée'
                  }, `🎧 ${t.dictation?.tabTitle || 'Mode Dictée'}`)
                )
              ),

              // Diff or Clean text
              h('div', { className: 'diff-container' },
                viewMode === 'clean'
                  ? result.improvedText
                  : result.diffTokens.map((tTok, idx) => {
                      if (tTok.type === 'removed') {
                        return h('del', { key: idx, className: 'diff-token diff-removed', title: t.comparison.diffLegendRemoved || 'Supprimé' }, tTok.value);
                      }
                      if (tTok.type === 'added') {
                        return h('ins', { key: idx, className: 'diff-token diff-added', title: t.comparison.diffLegendAdded || lvl }, tTok.value);
                      }
                      return h('span', { key: idx }, tTok.value);
                    })
              ),

              // Notes section
              h('div', { className: 'notes-section', style: { marginTop: '1rem' } },
                h('div', { className: 'notes-header', style: { fontSize: '0.85rem' } }, `🎓 ${(t.comparison.pedagogicalNotesTitle || '').replace(/B2/g, lvl)}`),
                h('div', {
                  style: {
                    background: meta.badgeBg, border: `1px solid ${meta.borderActive}`, borderRadius: 'var(--radius-md)',
                    padding: '0.75rem 0.9rem', fontSize: '0.825rem', color: 'var(--text-primary)', marginBottom: '0.75rem'
                  }
                }, h('strong', null, `${t.comparison.overallFeedbackTitle} : `), result.overallFeedback),

                // Filters
                h('div', { style: { display: 'flex', gap: '0.35rem', flexWrap: 'wrap', marginBottom: '0.65rem' } },
                  h('button', {
                    className: 'btn-secondary',
                    style: { padding: '0.2rem 0.5rem', fontSize: '0.7rem', borderColor: selectedCriterion === 'all' ? meta.color : 'var(--border-subtle)' },
                    onClick: () => setLevelFilterCriteria((prev) => ({ ...prev, [lvl]: 'all' }))
                  }, `${t.comparison.filterAll} (${result.pedagogicalNotes.length})`),
                  ['sociolinguistic', 'coherence', 'grammar', 'vocabulary'].map((crit) => {
                    const count = result.pedagogicalNotes.filter((n) => n.criterion === crit).length;
                    if (count === 0) return null;
                    return h('button', {
                      key: crit,
                      className: 'btn-secondary',
                      style: { padding: '0.2rem 0.5rem', fontSize: '0.7rem', borderColor: selectedCriterion === crit ? meta.color : 'var(--border-subtle)' },
                      onClick: () => setLevelFilterCriteria((prev) => ({ ...prev, [lvl]: crit }))
                    }, `${t.criteria[crit] || crit} (${count})`);
                  })
                ),

                // Note Cards
                h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.65rem' } },
                  filteredNotes.map((note) => h('div', { key: note.id, className: 'note-card' },
                    h('span', { className: `note-badge ${note.criterion}` }, t.criteria[note.criterion] || note.criterion.toUpperCase()),
                    h('div', { className: 'note-title', style: { fontSize: '0.85rem' } }, note.title),
                    note.originalExcerpt && h('div', { style: { fontSize: '0.78rem', color: 'var(--text-muted)', marginBottom: '0.25rem' } },
                      h('span', { style: { textDecoration: 'line-through', color: 'var(--diff-removed-text)' } }, note.originalExcerpt),
                      h('span', { style: { margin: '0 0.35rem' } }, '➔'),
                      h('span', { style: { color: 'var(--diff-added-text)', fontWeight: 500 } }, note.improvedExcerpt)
                    ),
                    h('p', { className: 'note-explanation', style: { fontSize: '0.8rem' } }, note.explanation)
                  ))
                )
              )
            )
          )
        );
      };

      const renderDictationPane = () => {
        const dt = t.dictation || TRANSLATIONS.fr.dictation;
        const activeText = dictationTab === 'sentence' ? currentSentenceInput : fullDictationInput;
        const activeWords = countFrenchWords(activeText);

        const mistakesBreakdown = dictationEvaluation ? dictationEvaluation.mistakes.reduce((acc, m) => {
          acc[m.category] = (acc[m.category] || 0) + 1;
          return acc;
        }, { accords: 0, accents: 0, homophones: 0, lexique: 0 }) : { accords: 0, accents: 0, homophones: 0, lexique: 0 };

        return h('section', { className: 'pane dictation-pane' },
          // Header
          h('div', { className: 'pane-header dictation-header' },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: '0.65rem' } },
              h('button', {
                className: 'btn-secondary',
                onClick: () => {
                  SpeechService.cancel();
                  setIsPlayingAudio(false);
                  setCustomDictationLevel(null);
                  setActiveMode('writing');
                },
                style: { padding: '0.35rem 0.65rem', fontSize: '0.8rem' }
              }, '← ' + (t.editor.paneTitle ? 'Rédaction' : 'Retour')),
              h('div', { className: 'pane-title' }, `🎧 ${dt.tabTitle}`),
              h('span', {
                className: 'cefr-level-badge',
                style: { background: 'rgba(99, 102, 241, 0.15)', color: 'var(--accent-primary)', border: '1px solid var(--border-glow)' }
              }, dictationTargetLevel)
            ),
            h('div', { style: { display: 'flex', alignItems: 'center', gap: '0.5rem' } },
              h('button', {
                type: 'button',
                className: 'btn-secondary',
                onClick: () => setIsSettingsOpen(true),
                style: {
                  fontSize: '0.75rem',
                  padding: '0.2rem 0.55rem',
                  height: '28px',
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '0.35rem',
                  borderRadius: 'var(--radius-sm)',
                  background: (settings.ttsConfig && settings.ttsConfig.engine !== 'webspeech') ? 'rgba(99, 102, 241, 0.15)' : 'var(--bg-surface)',
                  borderColor: (settings.ttsConfig && settings.ttsConfig.engine !== 'webspeech') ? 'var(--accent-primary)' : 'var(--border-subtle)',
                  color: (settings.ttsConfig && settings.ttsConfig.engine !== 'webspeech') ? 'var(--accent-primary)' : 'var(--text-secondary)',
                  cursor: 'pointer'
                },
                title: 'Paramètres de voix TTS'
              },
                h('span', null, '🎙️'),
                h('span', null,
                  settings.ttsConfig && settings.ttsConfig.engine === 'google-cloud'
                    ? `IA (${(settings.ttsConfig.voiceId || '').replace('fr-FR-', '')})`
                    : settings.ttsConfig && settings.ttsConfig.engine === 'openai'
                    ? `OpenAI (${settings.ttsConfig.voiceId})`
                    : 'Web Speech'
                )
              ),
              h('div', { className: 'dictation-speed-selector' },
                h('span', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginRight: '0.2rem' } }, dt.speedLabel),
                h('button', {
                  className: `btn-speed ${dictationSpeed <= 0.8 ? 'active' : ''}`,
                  onClick: () => setDictationSpeed(0.75)
                }, '0.75x'),
                h('button', {
                  className: `btn-speed ${dictationSpeed > 0.8 ? 'active' : ''}`,
                  onClick: () => setDictationSpeed(1.0)
                }, '1.0x')
              )
            )
          ),

          // Content
          h('div', { className: 'pane-content dictation-content' },
            // Audio Deck
            h('div', { className: 'dictation-deck-card' },
              h('div', { className: 'dictation-deck-top' },
                h('div', { className: 'dictation-stepper-info' },
                  h('span', { className: 'dictation-stepper-label' },
                    dt.sentenceCounter
                      .replace('{current}', String(dictationIndex + 1))
                      .replace('{total}', String(dictationSentences.length || 1))
                  ),
                  h('div', { className: 'dictation-progress-bar' },
                    h('div', {
                      className: 'dictation-progress-fill',
                      style: { width: `${((dictationIndex + 1) / Math.max(1, dictationSentences.length)) * 100}%` }
                    })
                  )
                ),
                isPlayingAudio && h('div', { className: 'dictation-sound-wave' },
                  h('span', { className: 'wave-bar bar-1' }),
                  h('span', { className: 'wave-bar bar-2' }),
                  h('span', { className: 'wave-bar bar-3' }),
                  h('span', { className: 'wave-bar bar-4' }),
                  h('span', { style: { fontSize: '0.75rem', color: 'var(--accent-secondary)', marginLeft: '0.35rem' } }, 'Écoute...')
                )
              ),

              // Audio Controls
              h('div', { className: 'dictation-audio-controls' },
                h('button', {
                  className: 'btn-secondary',
                  onClick: handlePrevDictation,
                  disabled: dictationIndex === 0 || isPlayingAudio,
                  title: `${dt.prevSentence} (Ctrl + ←)`
                }, `◀ ${dt.prevSentence} `, h('kbd', { className: 'shortcut-kbd' }, 'Ctrl+←')),

                isPlayingAudio
                  ? h('button', {
                      className: 'btn-primary btn-dictation-play playing',
                      onClick: handlePauseDictation,
                      title: dt.pauseButton
                    }, `⏸ ${dt.pauseButton}`)
                  : h('button', {
                      className: 'btn-primary btn-dictation-play',
                      onClick: () => handlePlayDictation(),
                      title: dt.listenButton
                    }, `▶ ${dt.listenButton}`),

                h('button', {
                  className: 'btn-secondary btn-dictation-replay',
                  onClick: () => handlePlayDictation(),
                  title: `${dt.replayButton} (Ctrl + R)`
                }, `🔁 ${dt.replayButton} `, h('kbd', { className: 'shortcut-kbd' }, 'Ctrl+R')),

                h('button', {
                  className: 'btn-secondary',
                  onClick: handleNextDictation,
                  disabled: dictationIndex >= dictationSentences.length - 1 || isPlayingAudio,
                  title: `${dt.nextSentence} (Ctrl + →)`
                }, `${dt.nextSentence} ▶ `, h('kbd', { className: 'shortcut-kbd' }, 'Ctrl+→'))
              )
            ),

            // Input Tabs & Textarea
            h('div', { className: 'dictation-input-container' },
              h('div', { className: 'dictation-input-tabs' },
                h('button', {
                  className: `dictation-tab ${dictationTab === 'sentence' ? 'active' : ''}`,
                  onClick: () => { setDictationTab('sentence'); setDictationEvaluation(null); }
                }, `Phrase ${dictationIndex + 1}`),
                h('button', {
                  className: `dictation-tab ${dictationTab === 'full' ? 'active' : ''}`,
                  onClick: () => { setDictationTab('full'); setDictationEvaluation(null); }
                }, `Texte intégral (${dictationSentences.length} phrases)`)
              ),

              h('div', { className: 'editor-wrapper' },
                h('textarea', {
                  className: 'essay-textarea dictation-textarea',
                  placeholder: dictationTab === 'sentence'
                    ? `Écoutez la phrase ${dictationIndex + 1} et tapez ce que vous entendez en français... (Ctrl+Espace pour réécouter)`
                    : 'Tapez la transcription intégrale ici...',
                  value: dictationTab === 'sentence' ? currentSentenceInput : fullDictationInput,
                  onChange: (e) => {
                    const val = e.target.value;
                    if (dictationTab === 'sentence') {
                      setSentenceInputs((prev) => ({ ...prev, [dictationIndex]: val }));
                    } else {
                      setFullDictationInput(val);
                    }
                  }
                })
              ),

              // Action Bar
              h('div', { className: 'dictation-action-bar' },
                h('div', { className: 'dictation-word-count' },
                  h('span', null, `Mots transcrits : `),
                  h('strong', null, activeWords),
                  dictationTab === 'sentence' && h('span', { style: { color: 'var(--text-muted)', marginLeft: '0.5rem' } }, `(Attendu : ~${currentDictSentence.wordCount} mots)`)
                ),
                h('div', { style: { display: 'flex', gap: '0.6rem' } },
                  h('button', {
                    className: 'btn-secondary',
                    onClick: handleResetDictationCurrent,
                    disabled: !activeWords,
                    style: { fontSize: '0.8rem', padding: '0.4rem 0.75rem' }
                  }, 'Effacer'),
                  h('button', {
                    className: 'btn-primary btn-dictation-submit',
                    onClick: handleEvaluateDictation,
                    disabled: !activeWords
                  }, `🎯 ${dt.evaluateButton}`)
                )
              )
            ),

            // Diagnostic Report Card
            dictationEvaluation && h('div', { className: 'dictation-report-card' },
              h('div', { className: 'dictation-report-header' },
                h('div', { className: 'accuracy-gauge-container' },
                  h('div', {
                    className: `accuracy-score-circle ${
                      dictationEvaluation.accuracy >= 90
                        ? 'score-excellent'
                        : dictationEvaluation.accuracy >= 75
                        ? 'score-good'
                        : 'score-needs-work'
                    }`
                  },
                    h('span', { className: 'score-number' }, `${dictationEvaluation.accuracy}%`),
                    h('span', { className: 'score-subtext' }, 'Exactitude')
                  ),
                  h('div', null,
                    h('h4', { style: { fontFamily: 'var(--font-display)', fontSize: '1.05rem', marginBottom: '0.25rem' } },
                      dictationEvaluation.accuracy >= 90
                        ? '🌟 Excellent réflexe orthographique !'
                        : dictationEvaluation.accuracy >= 75
                        ? '👍 Bon travail ! Quelques accords à ajuster.'
                        : '⚠️ Attention aux accords et aux homophones.'
                    ),
                    h('p', { style: { fontSize: '0.85rem', color: 'var(--text-secondary)' } },
                      `${dictationEvaluation.correctWordsCount} / ${dictationEvaluation.totalExpectedWords} mots corrects • ${dictationEvaluation.mistakesCount} erreur(s) détectée(s)`
                    )
                  )
                ),

                // Mistake Badges
                h('div', { className: 'mistake-category-pills' },
                  h('div', { className: 'mistake-pill pill-accords' },
                    h('span', { className: 'pill-dot dot-accords' }),
                    h('span', { className: 'pill-label' }, dt.categories.accords),
                    h('span', { className: 'pill-count' }, mistakesBreakdown.accords)
                  ),
                  h('div', { className: 'mistake-pill pill-accents' },
                    h('span', { className: 'pill-dot dot-accents' }),
                    h('span', { className: 'pill-label' }, dt.categories.accents),
                    h('span', { className: 'pill-count' }, mistakesBreakdown.accents)
                  ),
                  h('div', { className: 'mistake-pill pill-homophones' },
                    h('span', { className: 'pill-dot dot-homophones' }),
                    h('span', { className: 'pill-label' }, dt.categories.homophones),
                    h('span', { className: 'pill-count' }, mistakesBreakdown.homophones)
                  ),
                  h('div', { className: 'mistake-pill pill-lexique' },
                    h('span', { className: 'pill-dot dot-lexique' }),
                    h('span', { className: 'pill-label' }, dt.categories.lexique),
                    h('span', { className: 'pill-count' }, mistakesBreakdown.lexique)
                  )
                )
              ),

              // Visual Diff
              h('div', { className: 'dictation-diff-section' },
                h('h5', { style: { fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '0.5rem', textTransform: 'uppercase', letterSpacing: '0.04em' } },
                  'Comparaison visuelle (Attendu vs Votre transcription)'
                ),
                h('div', { className: 'dictation-diff-tokens' },
                  dictationEvaluation.diffTokens.map((token, idx) => {
                    if (token.type === 'unchanged') return h('span', { key: idx, className: 'diff-token unchanged' }, token.value);
                    if (token.type === 'removed') return h('del', { key: idx, className: 'diff-token diff-removed', title: 'Attendu' }, token.value);
                    if (token.type === 'added') return h('ins', { key: idx, className: 'diff-token diff-added', title: 'Votre saisie' }, token.value);
                    return null;
                  })
                )
              ),

              // Itemized mistakes list
              dictationEvaluation.mistakes.length > 0 ? h('div', { className: 'dictation-mistakes-list' },
                h('h5', { style: { fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '0.5rem', textTransform: 'uppercase', letterSpacing: '0.04em' } },
                  `Détail pédagogique des erreurs (${dictationEvaluation.mistakes.length})`
                ),
                h('div', { className: 'mistakes-grid' },
                  dictationEvaluation.mistakes.map((m) => h('div', { key: m.id, className: `mistake-item-card card-${m.category}` },
                    h('div', { className: 'mistake-words' },
                      h('span', { className: 'user-mistake-word' }, m.userWord),
                      h('span', { className: 'mistake-arrow' }, '➔'),
                      h('span', { className: 'expected-correct-word' }, m.expectedWord)
                    ),
                    h('span', { className: `mistake-category-tag tag-${m.category}` }, dt.categories[m.category] || m.category),
                    h('p', { className: 'mistake-explanation' }, m.explanation)
                  ))
                )
              ) : h('div', { className: 'dictation-perfect-badge' },
                h('span', { style: { fontSize: '1.25rem' } }, '✅'),
                h('span', null, 'Zéro faute ! Félicitations pour cette transcription impeccable.')
              )
            )
          )
        );
      };

      return h('div', { className: 'app-container' },
        // Header
        h('header', { className: 'app-header' },
          h('div', { className: 'brand' },
            h('div', { className: 'brand-icon' }, '✍️'),
            h('div', null,
              h('span', { className: 'brand-title' }, t.brand.title),
              h('span', { className: 'brand-badge' }, t.brand.badge)
            )
          ),
          h('div', { className: 'header-actions' },
            h('span', { style: { fontSize: '0.8rem', color: 'var(--text-muted)' } },
              t.header.engine, h('strong', { style: { color: 'var(--text-secondary)' } }, settings.provider.toUpperCase())
            ),

            // Language Selector
            h('div', { className: 'language-selector-wrapper', title: t.header.language },
              h('span', { className: 'language-selector-icon' }, '🌐'),
              h('select', {
                className: 'language-select',
                value: currentLanguage,
                onChange: (e) => handleLanguageChange(e.target.value),
                'aria-label': t.header.language
              },
                h('option', { value: 'fr' }, '🇫🇷 FR'),
                h('option', { value: 'en' }, '🇬🇧 EN'),
                h('option', { value: 'zh' }, '🇨🇳 ZH'),
                h('option', { value: 'vi' }, '🇻🇳 VI')
              )
            ),

            h('a', {
              href: 'https://buymeacoffee.com/writingdelfb2',
              target: '_blank',
              rel: 'noopener noreferrer',
              className: 'btn-bmc',
              title: t.header.coffeeTitle,
              'aria-label': t.header.coffeeTitle
            },
              h('span', { className: 'btn-bmc-icon' }, '☕'),
              h('span', { className: 'btn-bmc-text' }, t.header.coffeeLabel)
            ),
            h('button', {
              className: 'btn-icon',
              onClick: () => setTheme(theme === 'dark' ? 'light' : 'dark'),
              title: theme === 'dark' ? t.header.themeLight : t.header.themeDark
            }, theme === 'dark' ? '☀️' : '🌙'),
            h('button', {
              className: 'btn-icon',
              onClick: () => setIsSettingsOpen(true),
              title: t.header.settings
            }, '⚙️')
          )
        ),

        // Workspace
        h('main', { className: 'workspace-grid' },
          // Left Pane (Editor or Dictation)
          activeMode === 'dictation'
            ? renderDictationPane()
            : h('section', { className: 'pane' },
                h('div', { className: 'pane-header' },
                  h('div', { className: 'pane-title' }, t.editor.paneTitle),
                  h('div', { style: { display: 'flex', alignItems: 'center', gap: '0.5rem' } },
                    h('button', {
                      className: 'btn-secondary',
                      onClick: handleReset,
                      disabled: !content.trim(),
                      style: { padding: '0.35rem 0.65rem', fontSize: '0.8rem' }
                    }, `🗑️ ${t.editor.clearButton}`)
                  )
                ),
                h('div', { className: 'pane-content' },
              // Prompt Box
              h('div', { className: 'prompt-box' },
                h('div', { className: 'prompt-controls' },
                  h('select', {
                    className: 'prompt-select',
                    value: selectedPrompt.id,
                    onChange: (e) => {
                      const p = prompts.find((item) => item.id === e.target.value);
                      if (p) handleSelectPrompt(p);
                    }
                  },
                    prompts.map((p) => h('option', { key: p.id, value: p.id }, `[${(t.categories[p.category] || p.category).toUpperCase()}] ${p.title}`))
                  ),
                  h('button', { className: 'btn-secondary', onClick: handleRandomPrompt }, `🎲 ${t.editor.randomTopicButton}`)
                ),
                h('div', { className: 'prompt-details' },
                  h('p', { className: 'prompt-scenario' }, selectedPrompt.scenario),
                  h('p', { className: 'prompt-instructions' }, '📌 ' + selectedPrompt.instructions)
                )
              ),

              // Textarea
              h('div', { className: 'editor-wrapper' },
                h('textarea', {
                  className: 'essay-textarea',
                  placeholder: t.editor.inputPlaceholder,
                  value: content,
                  onChange: (e) => setContent(e.target.value)
                })
              ),

              // CEFR Level Selector
              h('div', { className: 'cefr-selector-container', role: 'group', 'aria-label': t.cefr?.selectorTitle },
                h('div', { className: 'cefr-selector-header' },
                  h('div', { className: 'cefr-selector-label' },
                    h('span', null, '📚'),
                    h('span', { className: 'cefr-selector-title' }, t.cefr?.selectorTitle || 'Niveaux CECRL :'),
                    h('span', { className: 'cefr-selector-hint' }, `(${t.cefr?.selectorHint || '1 ou 2'})`)
                  ),
                  selectorNotice && h('span', { className: 'cefr-selector-notice' }, selectorNotice)
                ),
                h('div', { className: 'cefr-pills-grid' },
                  ALL_CEFR_LEVELS.map((lvl) => {
                    const isSelected = selectedLevels.includes(lvl);
                    const meta = CEFR_LEVEL_METADATA[lvl];
                    const levelTrans = t.cefr?.levels?.[lvl];
                    const isMaxDisabled = !isSelected && selectedLevels.length >= 2;

                    return h('label', {
                      key: lvl,
                      className: `cefr-pill ${isSelected ? 'active' : ''} ${isMaxDisabled ? 'disabled-max' : ''}`,
                      style: {
                        '--level-color': meta.color,
                        '--level-bg': meta.badgeBg,
                        '--level-border': meta.borderActive
                      },
                      title: `${lvl} — ${levelTrans?.name || lvl}: ${levelTrans?.desc || ''}`
                    },
                      h('input', {
                        type: 'checkbox',
                        checked: isSelected,
                        onChange: () => handleToggleLevel(lvl),
                        className: 'cefr-checkbox-input',
                        'aria-label': `CEFR ${lvl}`
                      }),
                      h('span', { className: 'cefr-pill-code' }, lvl),
                      h('span', { className: 'cefr-pill-name' }, levelTrans?.name || lvl)
                    );
                  })
                )
              ),

              // Footer with Word Counter
              h('div', { className: 'editor-footer' },
                h('div', { className: 'word-counter-badge' },
                  h('div', { className: 'progress-bar-container', title: `${progressPercent}%` },
                    h('div', {
                      className: 'progress-bar-fill',
                      style: {
                        width: `${progressPercent}%`,
                        backgroundColor: isTargetAchieved ? 'var(--counter-success)' : 'var(--counter-under)'
                      }
                    })
                  ),
                  h('span', { className: `counter-text ${isTargetAchieved ? 'achieved' : 'under'}` },
                    `${wordCount} / 250 ${t.editor.wordsLabel}`
                  ),
                  h('span', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } },
                    isTargetAchieved ? `(${t.editor.statusAchieved})` : `(${t.editor.statusUnder})`
                  )
                ),
                h('button', {
                  className: 'btn-primary',
                  onClick: handleImprove,
                  disabled: isAnyLoading,
                  title: wordCount === 0 ? "Générer un texte modèle avec l’IA" : undefined
                }, isAnyLoading ? t.comparison.analyzingButton : `✨ ${t.comparison.improveButton}`)
              )
            )
          ),

          // Right Pane (Comparison Container)
          h('section', { className: 'pane comparison-pane-outer' },
            h('div', { className: 'pane-header' },
              h('div', { className: 'pane-title' }, t.comparison.paneTitle),
              h('div', {
                style: {
                  fontSize: '0.75rem', color: 'var(--text-muted)', background: 'var(--bg-surface)',
                  padding: '0.2rem 0.55rem', borderRadius: 'var(--radius-full)', border: '1px solid var(--border-subtle)'
                }
              }, `🪟 ${selectedLevels.length} ${selectedLevels.length === 1 ? 'fenêtre' : 'fenêtres'} (${selectedLevels.join(' + ')})`)
            ),
            h('div', { className: 'pane-content', style: { padding: '0.75rem' } },
              h('div', {
                className: `comparison-windows-wrapper ${selectedLevels.length === 1 ? 'single-window' : 'dual-window'}`
              },
                selectedLevels.map((lvl) => renderComparisonWindow(lvl))
              )
            )
          )
        ),

        // Settings Modal
        isSettingsOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-content' },
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' } },
              h('h3', { style: { fontFamily: 'var(--font-display)', fontSize: '1.15rem' } }, t.settings.title),
              h('button', { className: 'btn-icon', onClick: () => setIsSettingsOpen(false) }, t.settings.closeButton)
            ),

            // Language Option in Modal
            h('div', { style: { marginBottom: '1.25rem' } },
              h('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' } }, t.settings.languageLabel),
              h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '0.5rem' } },
                [
                  { code: 'fr', label: '🇫🇷 Français' },
                  { code: 'en', label: '🇬🇧 English' },
                  { code: 'zh', label: '🇨🇳 中文' },
                  { code: 'vi', label: '🇻🇳 Tiếng Việt' }
                ].map((item) => h('button', {
                  key: item.code,
                  type: 'button',
                  className: `btn-secondary ${currentLanguage === item.code ? 'active' : ''}`,
                  style: {
                    padding: '0.5rem',
                    fontSize: '0.85rem',
                    borderColor: currentLanguage === item.code ? 'var(--accent-primary)' : 'var(--border-subtle)',
                    background: currentLanguage === item.code ? 'rgba(99, 102, 241, 0.15)' : 'var(--bg-surface)'
                  },
                  onClick: () => handleLanguageChange(item.code)
                }, item.label))
              )
            ),

            h('div', { style: { marginBottom: '1.25rem' } },
              h('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' } }, t.settings.providerLabel),
              h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.65rem' } },
                h('label', {
                  style: {
                    display: 'flex', gap: '0.75rem', padding: '0.75rem', borderRadius: 'var(--radius-md)',
                    border: '1px solid ' + (settings.provider === 'mock' ? 'var(--accent-primary)' : 'var(--border-subtle)'),
                    background: settings.provider === 'mock' ? 'rgba(99, 102, 241, 0.08)' : 'var(--bg-secondary)',
                    cursor: 'pointer'
                  }
                },
                  h('input', { type: 'radio', name: 'prov', checked: settings.provider === 'mock', onChange: () => setSettings({ ...settings, provider: 'mock' }) }),
                  h('div', null,
                    h('div', { style: { fontWeight: 600, fontSize: '0.9rem' } }, t.settings.mockOption)
                  )
                ),
                h('label', {
                  style: {
                    display: 'flex', gap: '0.75rem', padding: '0.75rem', borderRadius: 'var(--radius-md)',
                    border: '1px solid ' + (settings.provider === 'gemini' ? 'var(--accent-primary)' : 'var(--border-subtle)'),
                    background: settings.provider === 'gemini' ? 'rgba(99, 102, 241, 0.08)' : 'var(--bg-secondary)',
                    cursor: 'pointer'
                  }
                },
                  h('input', { type: 'radio', name: 'prov', checked: settings.provider === 'gemini', onChange: () => setSettings({ ...settings, provider: 'gemini' }) }),
                  h('div', null,
                    h('div', { style: { fontWeight: 600, fontSize: '0.9rem' } }, t.settings.geminiOption)
                  )
                )
              )
            ),
            settings.provider === 'gemini' && h('div', { style: { marginBottom: '1.25rem' } },
              h('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' } }, t.settings.apiKeyLabel),
              h('input', {
                type: 'password',
                placeholder: t.settings.apiKeyPlaceholder,
                value: settings.apiKey || '',
                onChange: (e) => setSettings({ ...settings, apiKey: e.target.value }),
                style: { width: '100%', padding: '0.6rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-subtle)', background: 'var(--bg-secondary)', color: 'var(--text-primary)', fontFamily: 'monospace' }
              }),
              h('span', { style: { display: 'block', fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.35rem' } }, t.settings.apiKeyHelp)
            ),

            // TTS Voice Section (Feature 008)
            h('div', { style: { marginBottom: '1.25rem', paddingTop: '1rem', borderTop: '1px solid var(--border-subtle)' } },
              h('label', { style: { display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.9rem', fontWeight: 700, marginBottom: '0.6rem', color: 'var(--accent-secondary)' } },
                h('span', null, '🎙️'),
                h('span', null, t.tts ? t.tts.sectionTitle : 'Voix de la Dictée (Synthèse Vocale)')
              ),
              // Engine Selector
              h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.5rem', marginBottom: '0.85rem' } },
                [
                  { id: 'webspeech', label: t.tts?.engines?.webspeech || 'Navigateur Web Speech (Gratuit & Hors-ligne)' },
                  { id: 'google-cloud', label: t.tts?.engines?.googleCloud || 'Google Cloud TTS Neural2 / Studio (Haute Fidélité)' },
                  { id: 'openai', label: t.tts?.engines?.openai || 'OpenAI TTS (Voix Expressive)' }
                ].map((eng) =>
                  h('label', {
                    key: eng.id,
                    style: {
                      display: 'flex', alignItems: 'center', gap: '0.6rem', padding: '0.55rem 0.75rem',
                      borderRadius: 'var(--radius-sm)', border: '1px solid',
                      borderColor: (settings.ttsConfig?.engine === eng.id) ? 'var(--accent-primary)' : 'var(--border-subtle)',
                      background: (settings.ttsConfig?.engine === eng.id) ? 'rgba(99, 102, 241, 0.08)' : 'var(--bg-surface)',
                      cursor: 'pointer', fontSize: '0.85rem'
                    }
                  },
                    h('input', {
                      type: 'radio',
                      name: 'tts-engine',
                      checked: (settings.ttsConfig?.engine || 'webspeech') === eng.id,
                      onChange: () => {
                        const firstVoice = FRENCH_VOICE_CATALOG.find((v) => v.provider === eng.id) || FRENCH_VOICE_CATALOG[0];
                        setSettings({
                          ...settings,
                          ttsConfig: {
                            ...(settings.ttsConfig || DEFAULT_TTS_CONFIG),
                            engine: eng.id,
                            voiceId: firstVoice.id
                          }
                        });
                      }
                    }),
                    h('span', { style: { fontWeight: (settings.ttsConfig?.engine || 'webspeech') === eng.id ? 600 : 400 } }, eng.label)
                  )
                )
              ),
              // Voice Timbre Dropdown & Custom Key
              h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.6rem' } },
                h('div', null,
                  h('label', { style: { display: 'block', fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.3rem', color: 'var(--text-secondary)' } },
                    t.tts?.voiceLabel || 'Timbre & Modèle de voix :'
                  ),
                  h('select', {
                    className: 'prompt-select',
                    value: settings.ttsConfig?.voiceId || 'webspeech-default',
                    onChange: (e) => setSettings({
                      ...settings,
                      ttsConfig: { ...(settings.ttsConfig || DEFAULT_TTS_CONFIG), voiceId: e.target.value }
                    }),
                    style: { width: '100%', padding: '0.5rem', fontSize: '0.85rem' }
                  },
                    FRENCH_VOICE_CATALOG
                      .filter((v) => v.provider === (settings.ttsConfig?.engine || 'webspeech'))
                      .map((v) => h('option', { key: v.id, value: v.id }, `[${v.styleBadge}] ${v.name} — ${v.description}`))
                  )
                ),
                settings.ttsConfig?.engine !== 'webspeech' && h('div', null,
                  h('label', { style: { display: 'block', fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.25rem', color: 'var(--text-secondary)' } },
                    settings.ttsConfig?.engine === 'google-cloud'
                      ? 'Clé API Google Cloud / Gemini (Optionnel si renseignée plus haut) :'
                      : 'Clé API OpenAI :'
                  ),
                  h('input', {
                    type: 'password',
                    placeholder: settings.ttsConfig?.engine === 'google-cloud' ? 'Laissez vide pour réutiliser la clé Gemini ci-dessus...' : 'sk-...',
                    value: (settings.ttsConfig?.engine === 'google-cloud' ? settings.ttsConfig?.googleApiKey : settings.ttsConfig?.openaiApiKey) || '',
                    onChange: (e) => {
                      const val = e.target.value;
                      if (settings.ttsConfig?.engine === 'google-cloud') {
                        setSettings({ ...settings, ttsConfig: { ...settings.ttsConfig, googleApiKey: val } });
                      } else {
                        setSettings({ ...settings, ttsConfig: { ...settings.ttsConfig, openaiApiKey: val } });
                      }
                    },
                    style: { width: '100%', padding: '0.5rem 0.75rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-subtle)', background: 'var(--bg-secondary)', color: 'var(--text-primary)', fontFamily: 'monospace', fontSize: '0.8rem' }
                  })
                ),
                h('div', { style: { display: 'flex', justifyContent: 'flex-start', marginTop: '0.3rem' } },
                  h('button', {
                    type: 'button',
                    className: 'btn-secondary',
                    onClick: async () => {
                      if (isTestingVoice) return;
                      setIsTestingVoice(true);
                      try {
                        await SpeechService.testVoiceSample(settings.ttsConfig || DEFAULT_TTS_CONFIG, settings.apiKey);
                      } catch (err) {
                        console.warn('Voice preview error:', err);
                      } finally {
                        setIsTestingVoice(false);
                      }
                    },
                    disabled: isTestingVoice,
                    style: { display: 'inline-flex', alignItems: 'center', gap: '0.45rem', fontSize: '0.85rem', padding: '0.45rem 0.85rem' }
                  }, isTestingVoice ? (t.tts?.testingLabel || 'Génération audio...') : (t.tts?.testButton || '🔊 Tester la voix'))
                )
              )
            ),
            h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: '0.75rem', marginTop: '1rem' } },
              h('button', { className: 'btn-secondary', onClick: () => setIsSettingsOpen(false) }, 'Annuler'),
              h('button', {
                className: 'btn-primary',
                onClick: () => {
                  const updated = { ...data, settings };
                  setData(updated);
                  StorageService.save(updated);
                  setIsSettingsOpen(false);
                }
              }, t.settings.saveButton)
            )
          )
        )
      );
    }

    ReactDOM.render(h(App), document.getElementById('root'));
  </script>
</body>
</html>
